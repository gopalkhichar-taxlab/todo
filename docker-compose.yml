services:
  postgres:
    image: postgres:16-alpine
    container_name: kudo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kudo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kudo}
      POSTGRES_DB: ${POSTGRES_DB:-kudo}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - kudo-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  kudo-pgdata:
